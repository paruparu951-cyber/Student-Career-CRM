<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interview Practice</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8f4ff, #f8fbff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 850px;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        h1 {
            color: #174a8b;
            margin-bottom: 10px;
        }

        h2 {
            color: #174a8b;
        }

        .subtitle {
            color: #555;
            margin-bottom: 30px;
        }

        label {
            display: block;
            text-align: left;
            font-weight: bold;
            color: #333;
            margin: 20px 0 8px;
        }

        select {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            background: white;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        .primary-btn {
            background: #168bd4;
            color: white;
        }

        .primary-btn:hover {
            background: #0876ba;
        }

        .secondary-btn {
            background: #52677d;
            color: white;
        }

        .secondary-btn:hover {
            background: #3e5266;
        }

        .hidden {
            display: none;
        }

        .question-number {
            text-align: left;
            color: #1761a0;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 25px;
            font-weight: bold;
            color: #253b55;
            margin-bottom: 30px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .option {
            display: flex;
            align-items: center;
            text-align: left;
            border: 2px solid #e0e6ed;
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: 0.2s;
            background: white;
        }

        .option:hover {
            border-color: #168bd4;
            background: #f3faff;
        }

        .option input {
            margin-right: 14px;
            transform: scale(1.2);
        }

        .option.selected {
            border-color: #168bd4;
            background: #eaf7ff;
        }

        .next-area {
            text-align: right;
        }

        .result-score {
            font-size: 40px;
            font-weight: bold;
            color: #1761a0;
            margin: 20px 0;
        }

        .result-info {
            font-size: 18px;
            color: #444;
            line-height: 1.8;
        }

        .result-message {
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
            color: #1761a0;
        }

        .percentage {
            font-size: 30px;
            font-weight: bold;
            margin: 10px 0;
            color: #168bd4;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .difficulty-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            background: #edf5ff;
            color: #1761a0;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .card {
                padding: 25px 18px;
            }

            .question-text {
                font-size: 20px;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- =========================================
             START SCREEN
        ========================================== -->

        <div id="startScreen" class="card">

            <h1>🎤 Interview Practice</h1>

            <p class="subtitle">
                Test your technical knowledge based on your selected domain and difficulty level.
            </p>

            <!-- DOMAIN -->

            <label for="domain">
                Select Domain
            </label>

            <select id="domain">

                <option value="html">
                    🌐 HTML
                </option>

                <option value="css">
                    🎨 CSS
                </option>

                <option value="javascript">
                    ⚡ JavaScript
                </option>

            </select>


            <!-- DIFFICULTY -->

            <label for="difficulty">
                Select Difficulty Level
            </label>

            <select id="difficulty">

                <option value="easy">
                    🟢 Easy
                </option>

                <option value="moderate">
                    🟡 Moderate
                </option>

                <option value="difficult">
                    🔴 Difficult
                </option>

            </select>


            <button
                class="primary-btn"
                onclick="startInterview()">

                Start Practice 🚀

            </button>

            <br>

            <button
                class="secondary-btn"
                onclick="goToDashboard()">

                ← Back to Dashboard

            </button>

        </div>


        <!-- =========================================
             QUESTION SCREEN
        ========================================== -->

        <div id="questionScreen" class="card hidden">

            <div
                id="questionNumber"
                class="question-number">
            </div>

            <div
                id="questionText"
                class="question-text">
            </div>

            <div
                id="optionsContainer"
                class="options">
            </div>

            <div class="next-area">

                <button
                    id="nextButton"
                    class="primary-btn"
                    onclick="nextQuestion()">

                    Next Question →

                </button>

            </div>

        </div>


        <!-- =========================================
             RESULT SCREEN
        ========================================== -->

        <div id="resultScreen" class="card hidden">

            <h1>Practice Complete 🎉</h1>

            <div
                id="score"
                class="result-score">
            </div>

            <div
                id="percentage"
                class="percentage">
            </div>

            <div
                id="resultInfo"
                class="result-info">
            </div>

            <div
                id="resultMessage"
                class="result-message">
            </div>

            <div class="button-group">

                <button
                    class="primary-btn"
                    onclick="restartPractice()">

                    Practice Again 🔄

                </button>

                <button
                    class="secondary-btn"
                    onclick="goToDashboard()">

                    ← Back to Dashboard

                </button>

            </div>

        </div>

    </div>

/* =====================================================
   VARIABLES
===================================================== */

let questions = [];

let currentQuestion = 0;

let score = 0;

let selectedAnswer = null;

let selectedDomain = "";

let selectedDifficulty = "";


/* =====================================================
   START INTERVIEW
===================================================== */

function startInterview() {

    selectedDomain =
        document.getElementById("domain").value;

    selectedDifficulty =
        document.getElementById("difficulty").value;

    questions =
        questionBank[selectedDomain][selectedDifficulty];

    if (!questions || questions.length === 0) {

        alert("No questions available.");

        return;

    }

    currentQuestion = 0;

    score = 0;

    selectedAnswer = null;

    document
        .getElementById("startScreen")
        .classList.add("hidden");

    document
        .getElementById("resultScreen")
        .classList.add("hidden");

    document
        .getElementById("questionScreen")
        .classList.remove("hidden");

    showQuestion();

}


/* =====================================================
   SHOW QUESTION
===================================================== */

function showQuestion() {

    const question =
        questions[currentQuestion];

    document
        .getElementById("questionNumber")
        .textContent =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        questions.length;

    document
        .getElementById("questionText")
        .textContent =
        question.question;

    const optionsContainer =
        document.getElementById(
            "optionsContainer"
        );

    optionsContainer.innerHTML = "";

    selectedAnswer = null;

    question.options.forEach(
        (option, index) => {

            const label =
                document.createElement("label");

            label.className = "option";

            const radio =
                document.createElement("input");

            radio.type = "radio";

            radio.name = "answer";

            radio.value = index;

            radio.addEventListener(
                "change",
                function () {

                    selectedAnswer =
                        Number(this.value);

                    document
                        .querySelectorAll(".option")
                        .forEach(
                            item =>
                                item.classList.remove(
                                    "selected"
                                )
                        );

                    label.classList.add(
                        "selected"
                    );

                }
            );

            label.appendChild(radio);

            const text =
                document.createTextNode(
                    option
                );

            label.appendChild(text);

            optionsContainer.appendChild(
                label
            );

        }
    );

    const nextButton =
        document.getElementById(
            "nextButton"
        );

    if (
        currentQuestion ===
        questions.length - 1
    ) {

        nextButton.textContent =
            "Finish Practice ✓";

    } else {

        nextButton.textContent =
            "Next Question →";

    }

}


/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion() {

    if (selectedAnswer === null) {

        alert("Please select an answer.");

        return;

    }

    const correctAnswer =
        questions[currentQuestion].answer;

    if (
        selectedAnswer ===
        correctAnswer
    ) {

        score++;

    }

    currentQuestion++;

    if (
        currentQuestion <
        questions.length
    ) {

        showQuestion();

    } else {

        showResult();

    }

}


/* =====================================================
   SHOW RESULT
===================================================== */

function showResult() {

    document
        .getElementById("questionScreen")
        .classList.add("hidden");

    document
        .getElementById("resultScreen")
        .classList.remove("hidden");

    const percentage =
        Math.round(
            (score / questions.length) *
            100
        );

    const domainName =
        selectedDomain === "html"
            ? "HTML"
            : selectedDomain === "css"
                ? "CSS"
                : "JavaScript";

    const difficultyName =
        selectedDifficulty === "easy"
            ? "Easy"
            : selectedDifficulty === "moderate"
                ? "Moderate"
                : "Difficult";

    document
        .getElementById("score")
        .textContent =
        score +
        " / " +
        questions.length;

    document
        .getElementById("percentage")
        .textContent =
        percentage +
        "%";

    document
        .getElementById("resultInfo")
        .innerHTML =
        "Domain: <strong>" +
        domainName +
        "</strong><br>" +

        "Difficulty: <strong>" +
        difficultyName +
        "</strong>";

    let message;

    if (percentage === 100) {

        message =
            "Excellent! 🌟 Perfect score!";

    } else if (percentage >= 80) {

        message =
            "Great job! 👍 Keep it up!";

    } else if (percentage >= 60) {

        message =
            "Good work! 💪 Keep practicing.";

    } else {

        message =
            "Keep practicing! 💪 You can improve.";

    }

    document
        .getElementById("resultMessage")
        .textContent =
        message;


    /* =================================================
       SAVE RESULT FOR DASHBOARD
    ================================================= */

    const result = {

        domain: domainName,

        difficulty: difficultyName,

        score: score,

        total: questions.length,

        percentage: percentage,

        message: message,

        date: new Date().toLocaleString()

    };

    localStorage.setItem(
        "interviewResult",
        JSON.stringify(result)
    );

}


/* =====================================================
   RESTART PRACTICE
===================================================== */

function restartPractice() {

    document
        .getElementById("resultScreen")
        .classList.add("hidden");

    document
        .getElementById("startScreen")
        .classList.remove("hidden");

}


/* =====================================================
   GO TO DASHBOARD
===================================================== */

function goToDashboard() {

    window.location.href =
        "index.html";

}
